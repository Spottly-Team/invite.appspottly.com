# Deploy: publish directory = root di questo repo (non serve build)

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# /mario → invite.html (i file in .well-known/ hanno priorità come statici)
[[redirects]]
  from = "/:username"
  to = "/invite.html"
  status = 200
